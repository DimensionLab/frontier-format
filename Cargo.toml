# Generated by DimensionLab's export tooling. Dependency versions are managed upstream;
# propose changes to member crates, not to this file.
[workspace]
resolver = "3"
members = ["crates/frontier-core/", "crates/frontier-data/", "crates/frontier-prep-kernels/"]

[workspace.package]
version = "0.9.1"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
authors = ["DimensionLab <hello@dimensionlab.org>"]
repository = "https://github.com/DimensionLab/frontier-format"
homepage = "https://dimensionlab.org"

[workspace.dependencies]
arrow = "60"
chrono = { version = "0.4", features = ["serde"] }
frontier-core = { path = "crates/frontier-core/", version = "0.9.1" }
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
