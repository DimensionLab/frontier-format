[project]
name = "frontier-data"
version = "0.9.14"
description = "DimensionLab Frontier – dataset ingestion, quality and splits for CFD surrogate training"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
  "arrayroute>=0.1.49,<0.2",
  "frontier-plugins>=1,<2",
  "scipy>=1.13",
  "numpy>=1.26",
  "pydantic>=2.10",
  "pyvista>=0.44",
  "zarr>=3.0",
  "numcodecs>=0.15",
  "huggingface_hub>=0.30",
  "typer>=0.15",
  "rich>=13.0",
  "fast-simplification>=0.1.9",
]

[project.optional-dependencies]
# The Well ingest reads HDF5; the MeshGraphNets TFRecord parser needs nothing extra.
ingest = ["arrayroute[hdf5]>=0.1.49,<0.2"]
snapshots = ["arrayroute[snapshots]>=0.1.35,<0.2"]
readers = ["arrayroute[tensorstore,zarrista,disk-cache]>=0.1.35,<0.2"]
server = ["frontier>=0.9,<1", "httpx>=0.27"]
test = [
  "pytest>=8", "meshio>=5", "arrayroute[hdf5]>=0.1.49,<0.2",
  "frontier>=0.9,<1", "httpx>=0.27",
  "arrayroute[tensorstore,zarrista,disk-cache]>=0.1.35,<0.2",
  "icechunk>=2.3,<3; python_version >= '3.12'",
]

[tool.uv.sources]
frontier-plugins = { workspace = true }

[project.scripts]
frontier-data = "frontier_data.cli:main"

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"


[tool.pytest.ini_options]
addopts = """
 --junitxml='../../reports/packages/frontier-data/unittests/junit.xml'
"""
