[project]
name = "frontier-plugins"
version = "1.4.0"
license = "Apache-2.0"
description = "Frontier extension API compatibility and metadata-only plugin discovery"
requires-python = ">=3.11,<3.14"
readme = 'README.md'
dependencies = ["packaging>=24"]


[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
exclude = [
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "dist",
]

line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]
ignore = []

fixable = ["ALL"]
unfixable = []
